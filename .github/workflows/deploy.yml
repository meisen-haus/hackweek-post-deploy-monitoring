name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  ENVIRONMENT: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # The DSN is public by design (it ships in the bundle); a repo variable
          # is fine, a secret works too.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN || secrets.SENTRY_DSN }}
          VITE_RELEASE: ${{ github.sha }}
          VITE_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Handed to the notify job so it can upload sourcemaps against the release.
      - name: Upload build for Sentry
        if: ${{ vars.SENTRY_URL != '' && vars.SENTRY_PROJECT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Register the release and upload its sourcemaps BEFORE any synthetic traffic
  # runs. Sourcemaps are applied when an event is processed, so events that
  # arrive before the upload keep minified stack traces forever.
  # ---------------------------------------------------------------------------
  sentry-release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Sentry can associate commits with the release.
          fetch-depth: 0

      # The built bundle + sourcemaps, so the release has artifacts and stack
      # traces in Sentry point at real source lines instead of minified output.
      - name: Download build
        if: ${{ vars.SENTRY_URL != '' && vars.SENTRY_PROJECT != '' }}
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Sentry release
        if: ${{ vars.SENTRY_URL != '' && vars.SENTRY_PROJECT != '' }}
        env:
          # Base URL of the Sentry install: trailing slash, no /api/0. Pointing
          # at a local devserver means the ngrok host forwarding to it, and the
          # devserver has to be started with `--ngrok=<host>` so its
          # system.url-prefix and ALLOWED_HOSTS match.
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_DEV_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'sentry' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          curl -sL https://sentry.io/get-cli/ | bash

          sentry-cli releases new "$GITHUB_SHA"

          # Commit association needs this repo linked in the org's GitHub
          # integration. A dev org usually has none, so warn instead of failing
          # the deploy over it.
          sentry-cli releases set-commits "$GITHUB_SHA" --auto \
            || echo "::warning::set-commits --auto failed; release has no commits"

          # Site is served from /<repo>/, so artifact URLs need that prefix.
          sentry-cli sourcemaps upload dist/assets \
            --release "$GITHUB_SHA" \
            --url-prefix '~/${{ github.event.repository.name }}/assets'

          sentry-cli releases finalize "$GITHUB_SHA"

  # ---------------------------------------------------------------------------
  # Synthetic smoke tests against the real deploy. Two purposes: catch a broken
  # deploy before the release is announced, and drive a real browser so the SDK
  # loads and the release has telemetry attached to it. A `curl` check would do
  # neither — no JS execution means no events.
  # ---------------------------------------------------------------------------
  smoke:
    needs: [deploy, sentry-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Smoke test the deploy
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_RELEASE: ${{ github.sha }}
          SMOKE_LOADS: 3
        run: npm run smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The part this demo exists for. Registering the deploy is what makes Sentry
  # fire its post-deploy webhook, so it goes last: by the time the webhook
  # arrives, the bundle is live, its sourcemaps are uploaded, and the release
  # already has telemetry to look at.
  #
  # Runs even when the smoke tests fail — a failed deploy is exactly the case
  # you want the webhook to tell you about.
  # ---------------------------------------------------------------------------
  sentry-deploy:
    needs: [deploy, smoke]
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Register the deploy
        if: ${{ vars.SENTRY_URL != '' && vars.SENTRY_PROJECT != '' }}
        env:
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_DEV_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'sentry' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          curl -sL https://sentry.io/get-cli/ | bash

          echo "smoke tests: $SMOKE_RESULT"
          sentry-cli deploys new --release "$GITHUB_SHA" -e "$ENVIRONMENT" --url "$PAGE_URL"
