name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  ENVIRONMENT: production
  # Release identity. Nothing registers releases on this branch — the release
  # exists in Sentry purely as the `release` tag on the events the bundle sends.
  # The run number still makes every deploy a distinct release, so re-running
  # the workflow on an unchanged commit produces a net-new one instead of
  # piling telemetry onto the previous run's. The commit SHA stays as the
  # prefix, so a release is still traceable to its code.
  RELEASE: ${{ github.sha }}+${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # The DSN is public by design (it ships in the bundle); a repo variable
          # is fine, a secret works too. Unset means no telemetry at all — Vite
          # inlines this at build time, so the SDK is tree-shaken out entirely.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN || secrets.SENTRY_DSN }}
          VITE_RELEASE: ${{ env.RELEASE }}
          VITE_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Synthetic smoke tests against the real deploy. Two purposes: catch a broken
  # deploy, and drive a real browser so the SDK loads and the release has
  # telemetry attached to it. A `curl` check would do neither — no JS execution
  # means no events.
  # ---------------------------------------------------------------------------
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium --only-shell

      - name: Smoke test the deploy
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_RELEASE: ${{ env.RELEASE }}
          SMOKE_LOADS: 3
        run: npm run smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
